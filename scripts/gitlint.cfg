[general]
contrib=contrib-title-conventional-commits
ignore-merge-commits=false
ignore-revert-commits=false
# Fixup, amend and squash commits are folded into others before review, so they pass as they are.
ignore-fixup-commits=true
ignore-fixup-amend-commits=true
ignore-squash-commits=true

[title-max-length]
line-length=50

# Require exactly one space after the colon and a nonempty description.
[title-match-regex]
regex=^[a-z]+(?:\([^()\s]+\))?!?: \S.*$

[body-max-line-length]
line-length=70

[body-is-missing]
ignore-merge-commits=false
